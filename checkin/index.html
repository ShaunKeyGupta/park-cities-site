<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Check In | The Park Cities Gallery</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Check In">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1b2229;--soft:#3d4654;--paper:#f6f4ee;--bronze:#8c6d3f;--hair:#c9c1b0;--ok:#2f7d4f;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;display:flex;align-items:flex-start;justify-content:center;}
  .wrap{width:100%;max-width:560px;padding:26px 24px 40px;min-height:100%;}
  header{text-align:center;padding:14px 0 10px;}
  .seal{width:60px;height:60px;margin:0 auto 12px;border:1.5px solid var(--bronze);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
  .seal::after{content:"";position:absolute;inset:5px;border:.5px solid var(--bronze);border-radius:50%;}
  .seal span{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;color:var(--bronze);}
  .brand{font-weight:600;letter-spacing:.24em;font-size:12px;color:var(--bronze);text-transform:uppercase;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1.1;margin-top:14px;}
  .sub{color:var(--soft);font-size:15px;margin-top:6px;}
  form{margin-top:22px;}
  label{display:block;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:16px 0 7px;}
  input{width:100%;font-size:22px;color:var(--ink);background:#fff;border:1.5px solid var(--hair);border-radius:10px;padding:18px 16px;transition:border-color .15s;}
  input:focus{outline:none;border-color:var(--bronze);}
  button{width:100%;margin-top:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:18px;color:#fff;background:var(--ink);border:0;border-radius:10px;padding:20px;cursor:pointer;}
  button:active{background:#2a3647;}
  .hp{position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden;}
  .count{text-align:center;color:#9aa0a8;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:20px;}
  .ok{display:none;text-align:center;padding:40px 10px;}
  .ok .seal{border-color:var(--ok);margin-bottom:18px;}
  .ok .seal span{color:var(--ok);}
  .ok h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;color:var(--ink);}
  .ok p{color:var(--soft);font-size:17px;margin-top:10px;}
  .ok .prize{color:var(--bronze);font-weight:600;margin-top:8px;font-size:17px;}
  .next{background:var(--bronze)!important;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="formView">
    <header>
      <div class="seal"><span>PC</span></div>
      <div class="brand">The Park Cities Gallery</div>
      <h1>Welcome. Check in to win.</h1>
      <div class="sub">Enter all three to be in the drawing for the $1,000 gold coin.</div>
    </header>
    <form id="ci" action="https://crm.zoho.com/crm/WebToLeadForm" name="WebToLeads" method="POST" target="zoho_sink" accept-charset="UTF-8">
      <input type="hidden" name="xnQsjsdp" value="5aab3b96dd4a783edee8eebed574e058d55101014266cf64cfbc302cd5dbd5e9">
      <input type="hidden" name="xmIwtLD" value="e860290aa62940726c3706d5139213f9c047a4b47ce6be77d995a9c76d23a2d4c31ae4a0b904763421afe546ccb635b5">
      <input type="hidden" name="actionType" value="TGVhZHM=">
      <input type="hidden" name="returnURL" value="https://theparkcitiesgallery.com/checkin/">
      <input type="hidden" name="Lead Source" value="PCG Door Check-In">
      <input type="hidden" name="LEADCF183" value="Grand Opening Door">
      <div class="hp" aria-hidden="true"><label>Leave empty<input type="text" name="company_website" tabindex="-1" autocomplete="off"></label></div>
      <label for="n">Name</label>
      <input id="n" type="text" name="Last Name" required maxlength="80" autocomplete="off" autocapitalize="words" enterkeyhint="next">
      <label for="p">Phone</label>
      <input id="p" type="tel" name="Phone" required maxlength="30" autocomplete="off" inputmode="tel" enterkeyhint="next">
      <label for="e">Email</label>
      <input id="e" type="email" name="Email" required maxlength="100" autocomplete="off" inputmode="email" enterkeyhint="done">
      <button type="submit">Enter Me To Win</button>
      <div class="count" id="count"></div>
    </form>
  </div>

  <div class="ok" id="okView">
    <div class="seal"><span>PC</span></div>
    <h2>You're in!</h2>
    <p>Enjoy the evening.</p>
    <p class="prize">You're entered to win the $1,000 gold coin.</p>
    <button class="next" id="nextBtn" type="button">Check In Next Guest</button>
  </div>
</div>

<iframe name="zoho_sink" id="zoho_sink" style="display:none;width:0;height:0;border:0;" aria-hidden="true"></iframe>
<script>
(function(){
  var f=document.getElementById('ci'),
      formView=document.getElementById('formView'),
      okView=document.getElementById('okView'),
      nextBtn=document.getElementById('nextBtn'),
      countEl=document.getElementById('count'),
      nameEl=document.getElementById('n');
  function getCount(){try{return parseInt(localStorage.getItem('pcg_checkin')||'0',10)||0;}catch(e){return 0;}}
  function setCount(n){try{localStorage.setItem('pcg_checkin',String(n));}catch(e){}}
  function showCount(){var n=getCount();countEl.textContent=n?('Checked in tonight: '+n):'';}
  function reset(){f.reset();okView.style.display='none';formView.style.display='block';showCount();setTimeout(function(){nameEl.focus();},80);}
  showCount();
  setTimeout(function(){nameEl.focus();},200);
  f.addEventListener('submit',function(e){
    var hp=f.querySelector('input[name="company_website"]'); if(hp&&hp.value){e.preventDefault();return false;}
    // native validation handles required fields; let the post go to the hidden iframe
    setCount(getCount()+1);
    setTimeout(function(){
      formView.style.display='none';
      okView.style.display='block';
      showCount();
    },50);
  });
  nextBtn.addEventListener('click',reset);
})();
</script>
</body>
</html>
